[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lead2meeting"
version = "1.0.0"
description = "Lead-to-meeting conversion and revenue-recovery platform for B2B agencies, consultancies, and IT service companies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SISMAX"}
]
dependencies = [
    "fastapi>=0.92.0,<1.0.0",
    "uvicorn>=0.17.6,<1.0.0",
    "pydantic>=1.10.4,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "httpx>=0.23.0,<1.0.0",
    "aiofiles>=23.1.0,<25.0.0",
]

[project.scripts]
lead2meeting = "lead2meeting.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lead2meeting*"]

[tool.setuptools.package-data]
lead2meeting = ["static/*"]

[project.urls]
Homepage = "https://github.com/sismax01/lead2meeting"
Repository = "https://github.com/sismax01/lead2meeting.git"
